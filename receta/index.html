<!DOCTYPE html>
<html>
<head>
    <title>Mi Primera Web</title>
    <style>
                body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: aquamarine;
        }

        /* 1. Definimos la animación (la película) */
        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); color: red; } /* Se agranda y cambia a rojo */
            100% { transform: scale(1); }
        }

        h1 {
            color: darkblue;
            /* 2. Le decimos al h1 que use la animación */
            display: inline-block; /* Importante para que el scale funcione bien en títulos */
            animation: latido 1s infinite; 
        }

        .boton-recetas {
            background-color: rgb(17, 206, 55);
            padding: 10px 2%;
            border-radius: 30px;
            border: 3px solid rgb(214, 12, 12);
            transition: 0.4s; /* Esto suaviza el hover */
        }

        .boton-recetas:hover {
            transform: scale(1.2) rotate(3deg); /* Se agranda y gira un poquito */
            background-color: rgb(0, 0, 0);
            color: white;
            border: 3px solid pink;
        }
        .hero{
            display: flex;
            position: relative;
            gap: 20px;
            align-items: center;
            justify-content: center;
            background-color: black;
            padding: 30px 30px;
            opacity: 0.6;
        }
        .box{
            position:absolute;
            top: 20px;
            margin-left: 30px;
            color: black;
        }
        .superposition{
            position: relative;
            color: rgb(230, 221, 221);
            padding:  10%;
        }
    </style>
</head>
<body>
    <main>
        <section class="hero">
            <div class="box">
                <div class="box_example">box1</div>
            </div>
            <div class="superposition">
                <h1>Receta de la abuela</h1>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Debitis beatae, aperiam consequatur quisquam itaque reprehenderit!</p>
                <button class="boton-recetas">cocina ahora</button>
            </div>
        </section>
        <article>
            <h2>ingredientes</h2>
            <strong>empanadas</strong>
            <section class="empanadas">
                <ol class="ingredientes">
                    <li class="list_ingre">cebolla</li>
                    <li class="list_ingre">arina pan</li>
                    <li class="list_ingre">sal</li>
                    <li class="list_ingre">agua</li>
                    <li class="list_ingre">queso</li>
                </ol>
            </section>
            <figure>
                <img src="link_de_lo_que_sea" alt="imagen que muestra  una persona comiendo empanada">
            </figure>
        </article>
    </main>
    <footer>Alexa|&copy;2026</footer>
</body>
</html>
